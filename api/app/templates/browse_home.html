{% extends "base.html" %}
{% block title %}aodb{% endblock %}
{% block content %}
  <h1>aodb</h1>
  <p class="tagline">Anarchy Online item &amp; nano program database.</p>

  <div class="stat-grid">
    <a class="stat-card" href="/items">
      <span class="stat-number">{{ item_total }}</span>
      <span class="stat-label">Items</span>
    </a>
    <a class="stat-card" href="/nanos">
      <span class="stat-number">{{ nano_total }}</span>
      <span class="stat-label">Nano Programs</span>
    </a>
  </div>
{% endblock %}
