apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.aodbApi.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- with .Values.aodbApi.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.aodbApi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccount: {{ .Release.Name }}-serviceaccount
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.aodbApi.imageRepository }}:{{ .Values.aodbApi.imageTag }}
          ports:
            - containerPort: 8000
          env:
            - name: DUMP_URL
              value: {{ required "aodbApi.dumpUrl is required" .Values.aodbApi.dumpUrl | quote }}
            - name: REDIS_URL
              value: {{ required "aodbApi.redisUrl is required" .Values.aodbApi.redisUrl | quote }}
            {{- with .Values.aodbApi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.aodbApi.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            # Every boot re-downloads and parses the dump before the app accepts connections
            # (verified against the real ~5.7MB/125k-item dump: ~5-10s including network), so
            # this needs more headroom than a typical stateless app's startup.
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            # Needs at least as much headroom as readinessProbe above, plus
            # margin: the app's own startup can block for up to
            # _LOAD_WAIT_TIMEOUT_SECONDS (120s, app/main.py) waiting on
            # another pod's Redis dump-load lock before it ever binds the
            # port - a tighter liveness window than that kills the pod
            # mid-startup and restarts it into the same wait, which can
            # crash-loop indefinitely if the lock is slow to clear (e.g. a
            # Redis restart orphaning a held lock). The previous
            # initialDelaySeconds=60/periodSeconds=15 (default
            # failureThreshold=3) only gave 105s, still short of that 120s -
            # confirmed live in a real crash loop.
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
