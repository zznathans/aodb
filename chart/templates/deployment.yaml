apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  {{- if not .Values.aodbApi.keda.enabled }}
  replicas: {{ .Values.aodbApi.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- with .Values.aodbApi.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Legacy annotation-based AppArmor opt-in (K8s only gained a native
        # securityContext.appArmorProfile field in 1.30) - still honored by
        # current kubelets, and a no-op on nodes without the AppArmor LSM
        # (e.g. non-Debian/Ubuntu hosts). Key must match the container's
        # own `name:` below. (Seccomp is already enforced via the modern
        # securityContext.seccompProfile field further down - no annotation
        # equivalent needed.)
        container.apparmor.security.beta.kubernetes.io/{{ .Release.Name }}: runtime/default
        {{- with .Values.aodbApi.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-serviceaccount
      # This app never calls the Kubernetes API - it's a stateless
      # Redis-backed HTTP service - so the default-mounted SA token would
      # just be unused attack surface.
      automountServiceAccountToken: false
      {{- if and .Values.aodbApi.redis.enabled (not .Values.aodbApi.redisUrl) }}
      initContainers:
        - name: wait-for-redis
          # The app itself has no connection retry (api/app/redis_client.py) -
          # a lifespan startup Redis.get() against an unreachable Redis raises
          # and crashes the process rather than retrying. ArgoCD's sync-wave
          # ordering alone doesn't guarantee this: it has no health.lua for
          # the custom redis.redis.opstreelabs.in/Redis CRD, so it likely
          # marks that resource Healthy as soon as it's applied, not once the
          # underlying Redis pod is actually Ready. This waits on the same
          # host the app itself connects to (aodb.redisUrl in _helpers.tpl).
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 {{ include "aodb.redisName" . }}.{{ .Release.Namespace }}.svc.cluster.local 6379; do
                echo "waiting for redis..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.aodbApi.imageRepository }}:{{ .Values.aodbApi.imageTag }}
          ports:
            - containerPort: 8000
          env:
            - name: DUMP_URL
              value: {{ required "aodbApi.dumpUrl is required" .Values.aodbApi.dumpUrl | quote }}
            - name: REDIS_URL
              value: {{ include "aodb.redisUrl" . | quote }}
            {{- with .Values.aodbApi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Matches the base image's own built-in "nonroot" user/group
            # (gcr.io/distroless/base-debian13:nonroot, api/Dockerfile) -
            # a high UID/GID avoids colliding with real users/groups on
            # the host in a shared-kernel environment.
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
            # Nothing in the app writes to the filesystem at runtime - the
            # item dump loads straight into Redis over the network
            # (app/dump_loader.py), never to local disk.
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.aodbApi.resources | nindent 12 }}
          {{- if .Values.aodbApi.analyticsHtml }}
          volumeMounts:
            - name: analytics-html
              mountPath: /app/app/templates/_analytics.html
              subPath: _analytics.html
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            # Every boot re-downloads and parses the dump before the app accepts connections
            # (verified against the real ~5.7MB/125k-item dump: ~5-10s including network), so
            # this needs more headroom than a typical stateless app's startup.
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            # Needs enough headroom for the SLOWER of two things a pod can
            # be doing before it ever binds the port (the whole load runs
            # inside the lifespan startup hook, ahead of accepting any
            # connections):
            #   - waiting on another pod's load lock, capped at
            #     _LOAD_WAIT_TIMEOUT_SECONDS (120s, app/main.py) before
            #     giving up and serving what's already in Redis - a
            #     tighter liveness window than that kills the pod
            #     mid-wait and restarts it into the same wait, which can
            #     crash-loop indefinitely if the lock is slow to clear
            #     (e.g. a Redis restart orphaning a held lock);
            #   - actually holding the lock and doing the load itself,
            #     which has no such internal timeout/fallback - confirmed
            #     live that this can comfortably exceed 135s against the
            #     bundled Redis (chart/templates/redis.yaml) once the
            #     name-substring trigram index (app/store.py) is being
            #     populated: ~3.3M SADD calls for a full 122k-item/10.5k-
            #     nano dump, measured at ~32s of Redis-side command time
            #     for the SADD calls alone, on top of every HSET/ZADD.
            # 285s total below, comfortably under both: the 300s load
            # lock TTL (so a stuck load's own liveness kill doesn't race a
            # second pod already re-acquiring the same lock) and the
            # loading pod's actual observed duration.
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 16
      {{- if .Values.aodbApi.analyticsHtml }}
      volumes:
        - name: analytics-html
          configMap:
            name: {{ .Release.Name }}-analytics-html
      {{- end }}
