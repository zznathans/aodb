apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  {{- if not .Values.aodbApi.keda.enabled }}
  replicas: {{ .Values.aodbApi.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- with .Values.aodbApi.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Legacy annotation-based AppArmor opt-in (K8s only gained a native
        # securityContext.appArmorProfile field in 1.30) - still honored by
        # current kubelets, and a no-op on nodes without the AppArmor LSM
        # (e.g. non-Debian/Ubuntu hosts). Key must match the container's
        # own `name:` below. (Seccomp is already enforced via the modern
        # securityContext.seccompProfile field further down - no annotation
        # equivalent needed.)
        container.apparmor.security.beta.kubernetes.io/{{ .Release.Name }}: runtime/default
        {{- with .Values.aodbApi.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-serviceaccount
      # This app never calls the Kubernetes API - it's a stateless
      # Mongo-backed HTTP service - so the default-mounted SA token would
      # just be unused attack surface.
      automountServiceAccountToken: false
      {{- if and .Values.aodbApi.mongo.enabled (not .Values.aodbApi.mongoUrl) }}
      initContainers:
        - name: wait-for-mongo
          # The app itself has no connection retry (api/app/mongo_client.py) -
          # a lifespan startup _load_items() against an unreachable Mongo
          # raises and crashes the process rather than retrying. ArgoCD's
          # sync-wave ordering alone doesn't guarantee the bundled Mongo
          # StatefulSet's pod is actually Ready by the time this Deployment
          # starts, so this waits on the same host the app itself connects
          # to (aodb.mongoUrl in _helpers.tpl). Redis (aodbApi.redis), by
          # contrast, is only an optional cache the app already tolerates
          # being unreachable at any point (see app/store.py's
          # _cached_json) - no equivalent wait-for-redis is needed.
          image: busybox:1.36
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              until nc -z -w2 {{ include "aodb.mongoName" . }}.{{ .Release.Namespace }}.svc.cluster.local 27017; do
                echo "waiting for mongo..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.aodbApi.imageRepository }}:{{ .Values.aodbApi.imageTag }}
          ports:
            - containerPort: 8000
          env:
            - name: DUMP_URL
              value: {{ required "aodbApi.dumpUrl is required" .Values.aodbApi.dumpUrl | quote }}
            - name: MONGO_URL
              value: {{ include "aodb.mongoUrl" . | quote }}
            {{- $redisUrl := include "aodb.redisUrl" . }}
            {{- if $redisUrl }}
            - name: REDIS_URL
              value: {{ $redisUrl | quote }}
            {{- end }}
            {{- with .Values.aodbApi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Matches the base image's own built-in "nonroot" user/group
            # (gcr.io/distroless/base-debian13:nonroot, api/Dockerfile) -
            # a high UID/GID avoids colliding with real users/groups on
            # the host in a shared-kernel environment.
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
            # Nothing in the app writes to the filesystem at runtime - the
            # item dump loads straight into Mongo over the network
            # (app/dump_loader.py), never to local disk.
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.aodbApi.resources | nindent 12 }}
          {{- if .Values.aodbApi.analyticsHtml }}
          volumeMounts:
            - name: analytics-html
              mountPath: /app/app/templates/_analytics.html
              subPath: _analytics.html
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            # Every boot re-downloads and parses the dump before the app accepts connections
            # (verified against the real ~5.7MB/125k-item dump: ~5-10s including network), so
            # this needs more headroom than a typical stateless app's startup.
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            # Needs enough headroom for the SLOWER of two things a pod can
            # be doing before it ever binds the port (the whole load runs
            # inside the lifespan startup hook, ahead of accepting any
            # connections):
            #   - waiting on another pod's load lock, capped at
            #     _LOAD_WAIT_TIMEOUT_SECONDS (120s, app/main.py) before
            #     giving up and serving what's already in Mongo - a
            #     tighter liveness window than that kills the pod
            #     mid-wait and restarts it into the same wait, which can
            #     crash-loop indefinitely if the lock is slow to clear
            #     (e.g. a Mongo restart orphaning a held lock);
            #   - actually holding the lock and doing the load itself,
            #     which has no such internal timeout/fallback - previously
            #     confirmed live that this can comfortably exceed 135s
            #     against the bundled Redis this app used to be backed by
            #     (now Mongo, chart/templates/mongo.yaml) once the
            #     name-substring trigram index (app/store.py) is being
            #     populated across a full 122k-item/10.5k-nano dump. The
            #     285s figure below predates the move to Mongo - re-verify
            #     against real load timing once this runs against Mongo in
            #     production, since insert_many + index creation has
            #     different I/O characteristics than the old HSET/ZADD/SADD
            #     pipeline.
            # 285s total below, comfortably under both: the 300s load
            # lock TTL (so a stuck load's own liveness kill doesn't race a
            # second pod already re-acquiring the same lock) and the
            # loading pod's previously observed duration.
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 16
      {{- if .Values.aodbApi.analyticsHtml }}
      volumes:
        - name: analytics-html
          configMap:
            name: {{ .Release.Name }}-analytics-html
      {{- end }}
