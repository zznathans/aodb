apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.aodbApi.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- with .Values.aodbApi.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.aodbApi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccount: {{ .Release.Name }}-serviceaccount
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.aodbApi.imageRepository }}:{{ .Values.aodbApi.imageTag }}
          ports:
            - containerPort: 8000
          env:
            - name: DUMP_URL
              value: {{ required "aodbApi.dumpUrl is required" .Values.aodbApi.dumpUrl | quote }}
            - name: REDIS_URL
              value: {{ include "aodb.redisUrl" . | quote }}
            {{- with .Values.aodbApi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.aodbApi.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            # Every boot re-downloads and parses the dump before the app accepts connections
            # (verified against the real ~5.7MB/125k-item dump: ~5-10s including network), so
            # this needs more headroom than a typical stateless app's startup.
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            # Needs enough headroom for the SLOWER of two things a pod can
            # be doing before it ever binds the port (the whole load runs
            # inside the lifespan startup hook, ahead of accepting any
            # connections):
            #   - waiting on another pod's load lock, capped at
            #     _LOAD_WAIT_TIMEOUT_SECONDS (120s, app/main.py) before
            #     giving up and serving what's already in Redis - a
            #     tighter liveness window than that kills the pod
            #     mid-wait and restarts it into the same wait, which can
            #     crash-loop indefinitely if the lock is slow to clear
            #     (e.g. a Redis restart orphaning a held lock);
            #   - actually holding the lock and doing the load itself,
            #     which has no such internal timeout/fallback - confirmed
            #     live that this can comfortably exceed 135s against the
            #     bundled Redis (chart/templates/redis.yaml) once the
            #     name-substring trigram index (app/store.py) is being
            #     populated: ~3.3M SADD calls for a full 122k-item/10.5k-
            #     nano dump, measured at ~32s of Redis-side command time
            #     for the SADD calls alone, on top of every HSET/ZADD.
            # 285s total below, comfortably under both: the 300s load
            # lock TTL (so a stuck load's own liveness kill doesn't race a
            # second pod already re-acquiring the same lock) and the
            # loading pod's actual observed duration.
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 16
