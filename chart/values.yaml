aodbApi:
  # -- Public HTTPS URL to the item dump zip (a zipped <aodb><item aoid="..." .../></aodb> XML
  # file). Downloaded fresh into memory on every pod start - no database, no credentials.
  dumpUrl: ""

  # -- Connection URL for the Redis instance this app uses to store the loaded item dump and
  # back its search index (see the app's own README) - e.g. redis://my-redis:6379/0, or
  # redis://:password@my-redis:6379/0 if auth is enabled. Takes precedence over
  # aodbApi.redis.enabled if both are set. Leave unset (and set aodbApi.redis.enabled=true)
  # to use the chart's own bundled Redis instead of pointing at an externally-provisioned one.
  redisUrl: ""

  redis:
    # -- Deploy a bundled Redis instance (via the OT-CONTAINER-KIT/redis-operator `Redis`
    # custom resource, standalone mode only) alongside this app, instead of requiring an
    # externally-provisioned aodbApi.redisUrl. Requires the redis-operator CRDs to already be
    # installed in the target cluster. Off by default: enabling this for an existing
    # installation that already points aodbApi.redisUrl at its own Redis would otherwise start
    # deploying an unwanted, unused second Redis instance.
    enabled: false

    # -- maxmemory directive for the bundled Redis instance. Needs headroom below
    # aodbApi.redis.resources.limits.memory - too tight a gap caused real OOMKills in
    # production (the memory limit alone isn't enough; Redis needs to know its own budget to
    # evict rather than exceed the container limit).
    maxmemory: 500mb

    # -- maxmemory-policy directive for the bundled Redis instance. allkeys-lru is safe here
    # since this instance is dedicated to this app - evicting under memory pressure beats
    # refusing writes.
    maxmemoryPolicy: allkeys-lru

    image:
      # -- Container image repository for the bundled Redis instance.
      repository: quay.io/opstree/redis
      # -- Container image tag for the bundled Redis instance.
      tag: v8.6.1
      # -- Image pull policy for the bundled Redis instance.
      pullPolicy: IfNotPresent

    # -- Resource requests and limits for the bundled Redis instance's main container. Keep
    # the memory limit comfortably above aodbApi.redis.maxmemory above. The CPU limit needs
    # real burst headroom above the steady-state request - a full item/nano dump load builds
    # the name-substring trigram index (app/store.py) via ~3.3M SADD calls, measured at ~32s
    # of Redis-side command time for the SADD calls alone; a limit as tight as the request
    # throttled that burst badly enough to push the whole load past the app's liveness probe
    # window (chart/templates/deployment.yaml), confirmed live in a real crash loop.
    resources:
      requests:
        cpu: 101m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    exporter:
      image:
        # -- Container image repository for the redis-exporter sidecar.
        repository: quay.io/opstree/redis-exporter
        # -- Container image tag for the redis-exporter sidecar.
        tag: v1.84.0
        # -- Image pull policy for the redis-exporter sidecar.
        pullPolicy: Always
      # -- Resource requests and limits for the redis-exporter sidecar container.
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi

    storage:
      # -- Size of the PersistentVolumeClaim provisioned for the bundled Redis instance.
      size: 1Gi

    serviceMonitor:
      # -- Create a Prometheus Operator ServiceMonitor for the bundled Redis instance's
      # exporter metrics. Separate toggle from aodbApi.redis.enabled since it depends on the
      # prometheus-operator CRDs being installed, which isn't guaranteed just because Redis
      # itself is being deployed.
      enabled: false
      # -- Scrape interval for the Redis metrics ServiceMonitor.
      interval: 30s

  # -- Number of pod replicas. Safe to run more than one - each replica independently loads its
  # own in-memory copy of the dump from dumpUrl on startup, no shared state between them.
  replicaCount: 1

  # -- Extra annotations to add to the pod template (e.g. for a service mesh sidecar injector
  # or a config-reload trigger).
  podAnnotations: {}

  # -- Extra labels to add to the pod template, in addition to the chart-managed `app` label.
  podLabels: {}

  # -- Extra environment variables to set on the app container, in addition to DUMP_URL and
  # REDIS_URL. Each entry is a raw Kubernetes EnvVar (supports valueFrom, e.g. secretKeyRef) -
  # e.g. for API_ANALYTICS_KEY (see the app's own README).
  extraEnv: []

  # -- Raw HTML for client-side analytics (e.g. a Cloudflare beacon or Google Analytics
  # snippet), included verbatim on /api and every browse UI page - see the app's own
  # README for app/templates/_analytics.html. That file is gitignored and never part of the
  # published image, so it can't just be baked in; setting this instead renders it into a
  # ConfigMap and mounts it over that path in the pod. Leave unset (the default) for no
  # client-side analytics at all - this is unrelated to aodbApi.extraEnv's API_ANALYTICS_KEY,
  # which is server-side request analytics, not a page script.
  analyticsHtml: ""

  # -- Container image registry and repository for the aodb-api image.
  imageRepository: ghcr.io/zznathans/aodb
  # -- Image tag to deploy.
  imageTag: "1.9.0"
  # -- List of image pull secret names to attach to the ServiceAccount. Leave empty if the registry is public.
  imagePullSecrets: []

  # -- Resource requests and limits for the app container. The 256Mi memory
  # limit was too tight for the dump-load step and OOMKilled pods mid-load
  # in a real cluster (confirmed reproducible, not a one-off) - 512Mi gives
  # real headroom above the ~65MB peak RSS the dump parser alone was
  # measured at (app/dump_loader.py), which doesn't account for the rest of
  # the process (interpreter, FastAPI/uvicorn, the Redis client, the raw
  # HTTP response buffer) or growth in the dump/item schema over time.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

  service:
    # -- Port the Service listens on and forwards to the container's 8000.
    port: 80

  ingress:
    # -- Create an Ingress routing to this app's Service. Off by default -
    # see the chart README for why (the Service is meant to sit behind
    # whatever externally-managed ingress/traffic routing your cluster
    # already uses; this is an opt-in alternative for clusters that route
    # via a Kubernetes Ingress controller instead).
    enabled: false
    # -- Hostname to route to this app. Required when enabled.
    host: ""
    # -- IngressClass to use (e.g. "traefik"). Empty uses the cluster's
    # default IngressClass.
    className: ""
    # -- Extra annotations on the Ingress - e.g.
    # cert-manager.io/cluster-issuer, to have cert-manager automatically
    # issue the TLS certificate referenced by ingress.tls.secretName below.
    annotations: {}
    tls:
      # -- Terminate TLS on the Ingress. Typically paired with a
      # cert-manager.io/cluster-issuer annotation above so the certificate
      # is issued automatically.
      enabled: false
      # -- Name of the Secret holding the TLS certificate. When using
      # cert-manager, this is the Secret it creates/manages - pick any
      # name.
      secretName: ""

  # -- Raw Kubernetes objects to render alongside chart-managed resources.
  extraObjects: []
