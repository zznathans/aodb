suite: deployment
templates:
  - deployment.yaml
tests:
  - it: renders a single deployment using the configured image
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
      aodbApi.imageRepository: ghcr.io/zznathans/aodb-api
      aodbApi.imageTag: "1.2.3"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/zznathans/aodb-api:1.2.3

  - it: passes dumpUrl through as DUMP_URL
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: DUMP_URL
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: https://example.invalid/171003.xml.zip

  - it: fails when dumpUrl is not set
    set:
      aodbApi.mongo.enabled: false
      aodbApi.redisUrl: redis://example-redis:6379/0
    asserts:
      - failedTemplate:
          errorMessage: "aodbApi.dumpUrl is required"

  - it: passes redisUrl through as REDIS_URL
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: REDIS_URL
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: redis://example-redis:6379/0

  - it: fails when neither redisUrl nor redis.enabled is set
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
    asserts:
      - failedTemplate:
          errorMessage: "aodbApi.redisUrl is required (or set aodbApi.redis.enabled=true to deploy a bundled Redis)"

  - it: derives REDIS_URL from the bundled redis service when redis.enabled and redisUrl is unset
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redis.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: REDIS_URL
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: redis://RELEASE-NAME-redis.NAMESPACE.svc.cluster.local:6379/0

  - it: explicit redisUrl wins over redis.enabled when both are set
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
      aodbApi.redis.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: REDIS_URL
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: redis://example-redis:6379/0

  - it: no MONGO_URL env when mongo.enabled is set to false and mongoUrl is unset
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 2

  - it: passes mongoUrl through as a plain-value MONGO_URL
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
      aodbApi.mongoUrl: mongodb://example-mongo:27017/aodb
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[2].name
          value: MONGO_URL
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: mongodb://example-mongo:27017/aodb

  - it: derives MONGO_URL from the bundled mongo connection-string secret by default (mongo.enabled defaults to true)
    set:
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
      aodbApi.mongo.password: hunter2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[2].name
          value: MONGO_URL
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-mongodb-admin-aodb
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.key
          value: connectionString.standard

  - it: explicit mongoUrl wins over mongo.enabled when both are set
    set:
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
      aodbApi.mongoUrl: mongodb://example-mongo:27017/aodb
      aodbApi.mongo.password: hunter2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[2].name
          value: MONGO_URL
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: mongodb://example-mongo:27017/aodb

  - it: defaults to a single replica
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: scales up via replicaCount
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
      aodbApi.replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: runs as a non-root user with hardened security context
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL

  - it: has no extra pod annotations or labels by default
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
    asserts:
      - isNull:
          path: spec.template.metadata.annotations
      - equal:
          path: spec.template.metadata.labels
          value:
            app: RELEASE-NAME

  - it: adds podAnnotations to the pod template
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
      aodbApi.podAnnotations:
        example.com/annotation: hello
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            example.com/annotation: hello

  - it: adds podLabels to the pod template alongside the app label
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
      aodbApi.podLabels:
        example.com/label: hello
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app: RELEASE-NAME
            example.com/label: hello

  - it: appends extraEnv after DUMP_URL and REDIS_URL
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
      aodbApi.extraEnv:
        - name: API_ANALYTICS_KEY
          valueFrom:
            secretKeyRef:
              name: aodb-secrets
              key: api-analytics-key
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[2].name
          value: API_ANALYTICS_KEY
      - equal:
          path: spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.name
          value: aodb-secrets

  - it: no extraEnv by default
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 2

  - it: no analytics-html volume or mount by default
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
    asserts:
      - isNull:
          path: spec.template.spec.volumes
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts

  - it: mounts the analytics-html ConfigMap over _analytics.html when analyticsHtml is set
    set:
      aodbApi.mongo.enabled: false
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
      aodbApi.analyticsHtml: <script>hi</script>
    asserts:
      - equal:
          path: spec.template.spec.volumes[0]
          value:
            name: analytics-html
            configMap:
              name: RELEASE-NAME-analytics-html
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: analytics-html
            mountPath: /app/app/templates/_analytics.html
            subPath: _analytics.html
            readOnly: true
