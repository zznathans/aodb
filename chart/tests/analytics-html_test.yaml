suite: analytics-html
templates:
  - analytics-html.yaml
tests:
  - it: renders nothing when analyticsHtml is unset (default)
    set:
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ConfigMap with the raw HTML when analyticsHtml is set
    set:
      aodbApi.dumpUrl: https://example.invalid/171003.xml.zip
      aodbApi.redisUrl: redis://example-redis:6379/0
      aodbApi.analyticsHtml: <script>hi</script>
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-analytics-html
      - equal:
          path: data["_analytics.html"]
          value: <script>hi</script>
