name: Helm Release

# Packages chart/ and attaches the .tgz to the chart@X.Y.Z GitHub Release
# that release.yml's multi-semantic-release run just created, then publishes
# it two ways: as an OCI artifact at ghcr.io/zznathans/aodb/charts (no
# `helm repo add` needed, the primary/recommended path) and, for backwards
# compatibility with third-party tooling that doesn't speak OCI registries
# yet, to a classic Helm chart index at gh-pages:charts/ (served at
# https://aodb.ao.yeetbox.net/charts/, alongside the app's README doc site
# published by pages.yml on the same branch/domain, different path) so
# `helm repo add` still works too.
#
# chart/Chart.yaml's version/appVersion is updated in this job's own
# checkout just before packaging (cr package reads it to name the
# artifact), not on main beforehand - avoids needing a branch-protection-
# gated PR merge before every chart release. main gets a small non-blocking
# "sync Chart.yaml" PR afterward, same shape as docker.yml's image-tag-bump
# PR, purely for repo-state hygiene.
#
# Triggered via workflow_dispatch from release.yml (not `release: published`
# - GITHUB_TOKEN-created releases don't fire that event, see release.yml's
# comment) with the just-created tag as an input. `release: published` is
# also kept as a trigger so a manually-published/edited release still works.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The chart@X.Y.Z release tag to package"
        required: true

permissions: {}

jobs:
  package-and-publish:
    name: Package chart and publish
    if: startsWith(github.event.inputs.tag || github.event.release.tag_name, 'chart@')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # Also checked out alongside the tag checkout above (into gh-pages/)
      # rather than in a separate job handed the packaged chart via
      # upload-artifact/download-artifact - that round trip turned out
      # unreliable (the artifact was gone by the time a later step looked
      # for it). Packaging and publishing the index share one job/checkout
      # instead, no cross-job file handoff needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: gh-pages

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "3.17.0"

      - name: Set Chart.yaml version to match the release tag
        run: |
          version="${RELEASE_TAG#chart@}"
          sh scripts/bump-chart-version.sh "$version"

      - name: Package chart
        run: helm package chart -d .cr-release-packages

      - name: Upload package to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" .cr-release-packages/*.tgz --clobber --repo "${{ github.repository }}"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR (OCI)
        run: helm push .cr-release-packages/*.tgz oci://ghcr.io/zznathans/aodb/charts

      - name: Add the new package and regenerate charts/index.yaml
        run: |
          mkdir -p gh-pages/charts
          cp .cr-release-packages/*.tgz gh-pages/charts/
          helm repo index gh-pages/charts --url https://aodb.ao.yeetbox.net/charts --merge gh-pages/charts/index.yaml

      - name: Commit and push the index
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts
          if git diff --cached --quiet; then
            echo "Index already up to date, nothing to do."
            exit 0
          fi
          git commit -m "chore(charts): publish ${RELEASE_TAG} to the index"
          git push origin gh-pages

  sync-chart-yaml:
    name: Sync Chart.yaml on main
    needs: package-and-publish
    runs-on: ubuntu-latest
    permissions: {}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      # Minted from the aodb-release-bot GitHub App - see docker.yml's
      # bump-chart-image-tag job for why (App tokens aren't subject to
      # GitHub's anti-recursion rule, so this PR gets a normal CI run).
      - name: Generate a token for the release bot
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump Chart.yaml and open a PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version="${RELEASE_TAG#chart@}"
          sh scripts/bump-chart-version.sh "$version"

          if git diff --quiet -- chart/Chart.yaml; then
            echo "Chart.yaml already up to date, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="sync-chart-yaml-${RELEASE_TAG}"
          git checkout -b "$branch"
          git add chart/Chart.yaml
          git commit -m "chore(chart): sync Chart.yaml to ${RELEASE_TAG}"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(chart): sync Chart.yaml to ${RELEASE_TAG}" \
            --body "Keeps chart/Chart.yaml's version/appVersion in sync with [${RELEASE_TAG}](https://github.com/zznathans/aodb/releases/tag/${RELEASE_TAG}).")
          gh pr merge --auto --merge "$pr_url"
