name: Upload Scorecard SARIF

# Split out from scorecard.yml specifically so github/codeql-action/
# upload-sarif is never referenced in the same workflow file as
# publish_results: true -- see scorecard.yml's "Upload artifact" step
# comment for why. This workflow just picks up the SARIF artifact that
# run produced and forwards it to the code-scanning dashboard.

on:
  workflow_run:
    workflows: ["Scorecard supply-chain security"]
    types: [completed]

# Least-privilege default; the upload job below grants itself only what
# it actually needs.
permissions: {}

jobs:
  upload:
    name: Upload to code-scanning
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SARIF file
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
