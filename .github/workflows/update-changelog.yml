name: Update CHANGELOG

# Appends to api/CHANGELOG.md or chart/CHANGELOG.md depending on which
# stream's tag fired the release (app@* / chart@*) - the two packages
# version independently (see release.yml), so they keep separate
# changelogs too.
#
# Triggered via workflow_dispatch from release.yml (not `release: published`
# - GITHUB_TOKEN-created releases don't fire that event, see release.yml's
# comment) with the just-created tag as an input. `release: published` is
# also kept as a trigger so a manually-published/edited release still works.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The app@X.Y.Z or chart@X.Y.Z release tag"
        required: true

# Least-privilege default; each job below grants itself only what it actually needs.
permissions: {}

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine which package's changelog to update
        id: target
        run: |
          case "$RELEASE_TAG" in
            app@*) echo "path=api/CHANGELOG.md" >> "$GITHUB_OUTPUT" ;;
            chart@*) echo "path=chart/CHANGELOG.md" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unrecognized tag format: $RELEASE_TAG" >&2; exit 1 ;;
          esac

      # Fetched via `gh release view` rather than github.event.release.* -
      # those fields are only populated on the `release: published` trigger,
      # not workflow_dispatch (the normal path here, see the on: block).
      - name: Prepend release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_PATH: ${{ steps.target.outputs.path }}
        run: |
          release_date=$(gh release view "$RELEASE_TAG" --json publishedAt --jq .publishedAt)
          release_body=$(gh release view "$RELEASE_TAG" --json body --jq .body)
          {
            echo "## ${RELEASE_TAG} (${release_date%%T*})"
            echo
            echo "$release_body"
            echo
            if [ -f "$CHANGELOG_PATH" ]; then
              cat "$CHANGELOG_PATH"
            fi
          } > "${CHANGELOG_PATH}.new"
          mv "${CHANGELOG_PATH}.new" "$CHANGELOG_PATH"

      # Opened with GITHUB_TOKEN, not a PAT - see docker.yml's
      # bump-chart-image-tag job for why (same tradeoff: no auto CI run on
      # this PR, needs a manual re-run/approval before merging).
      - name: Open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_PATH: ${{ steps.target.outputs.path }}
        run: |
          if git diff --quiet -- "$CHANGELOG_PATH"; then
            echo "$CHANGELOG_PATH already up to date, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="changelog-${RELEASE_TAG}"
          git checkout -b "$branch"
          git add "$CHANGELOG_PATH"
          git commit -m "docs(changelog): add ${RELEASE_TAG} release notes"
          git push origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "docs(changelog): add ${RELEASE_TAG} release notes" \
            --body "Adds the ${RELEASE_TAG} release notes to ${CHANGELOG_PATH}."
