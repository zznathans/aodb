name: Dependency Review

# Not a required check (see api-ci.yml/chart-ci.yml for why that matters
# for required checks), so a plain workflow-level path filter is safe here
# - only worth running when a dependency manifest actually changed.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical
          deny-licenses: LGPL-2.0
          comment-summary-in-pr: always
