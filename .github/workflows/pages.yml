name: Sync READMEs to gh-pages

# GitHub Pages serves this repo's gh-pages branch directly (classic
# branch-based Pages, .nojekyll - no server-side processing). Each synced
# README.md gets a sibling index.html shell that fetches and renders it
# client-side (marked.js), so the site works without depending on any
# GitHub Pages Jekyll plugin behavior. Mirrors BeBot's pages.yml pattern.
#
# Only fires for app@X.Y.Z releases (chart-only releases don't touch the
# app's docs) and only syncs api/README.md (+ anything it links to), not
# chart/README.md - the chart's docs live in the release asset / repo
# browser instead, see helm-release.yml.
#
# Triggered via workflow_dispatch from release.yml (not `release: published`
# - GITHUB_TOKEN-created releases don't fire that event, see release.yml's
# comment) with the just-created tag as an input. `release: published` is
# also kept as a trigger so a manually-published/edited release still works.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The app@X.Y.Z release tag that triggered this sync"
        required: true

# Least-privilege default; each job below grants itself only what it actually needs.
permissions: {}

jobs:
  sync-readmes:
    name: Sync READMEs
    runs-on: ubuntu-latest
    if: startsWith(github.event.inputs.tag || github.event.release.tag_name, 'app@')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages

      - name: Sync api/README.md (+ linked README.md files) and their shells
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          write_shell() {
            local dir="$1" title="$2"
            cat > "${dir}index.html" << HTMLEOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>${title}</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
          <style>
            :root { color-scheme: light dark; }
            html, body { background: #0d1117; }
            body {
              max-width: 860px; margin: 2rem auto; padding: 0 1.5rem 4rem;
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
              line-height: 1.6;
              color: #c9d1d9;
            }
            a { color: #58a6ff; }
            code, pre { background: #161b22; border-radius: 6px; }
            pre { padding: 1rem; overflow-x: auto; }
            code { padding: 0.2em 0.4em; }
            pre code { padding: 0; background: none; }
            table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
            table th, table td { border: 1px solid #30363d; padding: 0.5rem 0.75rem; text-align: left; }
            img { max-width: 100%; }
            blockquote { border-left: 4px solid #30363d; margin: 0; padding-left: 1rem; opacity: 0.85; }
            h1, h2, h3 { border-bottom: 1px solid #21262d; padding-bottom: 0.3em; }
            hr { border: none; border-top: 1px solid #21262d; }
            @media (prefers-color-scheme: light) {
              html, body { background: #ffffff; }
              body { color: #1f2328; }
              a { color: #0969da; }
              code, pre { background: #f6f8fa; }
              table th, table td { border-color: #d0d7de; }
              blockquote { border-left-color: #d0d7de; }
              h1, h2, h3 { border-bottom-color: #d8dee4; }
              hr { border-top-color: #d8dee4; }
            }
          </style>
          </head>
          <body>
          <div id="content">Loading&hellip;</div>
          <script>
          fetch("README.md")
            .then(function (r) { return r.text(); })
            .then(function (md) {
              var renderer = new marked.Renderer();
              var baseLink = renderer.link.bind(renderer);
              renderer.link = function (href, title, text) {
                if (href && /(^|\/)README\.md(#.*)?$/.test(href) && !/^https?:\/\//.test(href)) {
                  href = href.replace(/(^|\/)README\.md(#.*)?$/, function (m, slash, hash) {
                    return (slash || "./") + (hash || "");
                  });
                }
                return baseLink(href, title, text);
              };
              document.getElementById("content").innerHTML = marked.parse(md, { renderer: renderer, gfm: true });
            })
            .catch(function (e) {
              document.getElementById("content").textContent = "Failed to load content: " + e;
            });
          </script>
          </body>
          </html>
          HTMLEOF
          }

          sync_doc() {
            local src_path="$1" dest_path="$2" title="$3"
            local dir
            dir="$(dirname "$dest_path")/"
            [ "$dir" = "./" ] && dir=""
            [ -n "$dir" ] && mkdir -p "$dir"
            git show "origin/main:${src_path}" > "${dir}README.md"
            write_shell "$dir" "$title"
          }

          sync_doc "api/README.md" "README.md" "aodb"

          # Follow any relative *.md links from api/README.md - not just a
          # hardcoded list, so a newly-linked doc gets picked up
          # automatically next release. Links are resolved relative to
          # api/, same as dest paths (api/ is dropped from the gh-pages
          # side since it's the site root there).
          linked=$(git show origin/main:api/README.md \
            | grep -oE '\]\([^)]+\.md\)' \
            | sed -E 's/^\]\((.+)\)$/\1/' \
            | grep -viE '^https?://' \
            | sort -u)

          for rel_path in $linked; do
            title=$(basename "$(dirname "$rel_path")")
            sync_doc "api/${rel_path}" "$rel_path" "$title"
          done

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to sync, gh-pages already up to date."
            exit 0
          fi

          git commit -m "docs: sync README(s) from main [skip ci]"
          git push origin gh-pages
