name: Pages

# Publishes api/README.md as a GitHub Pages site living on the same
# gh-pages branch release.yml's publish-chart job already manages (Helm
# chart index under charts/). Deliberately its own workflow, not a step
# tacked onto that release job: publish-chart only runs when
# semantic-release actually cuts a release, and docs-only commits
# (conventional-commits type "docs") never do - so a docs-only change
# would otherwise never make it onto the site. The concurrency group
# below is shared with that job so the two never push to gh-pages at the
# same time.
on:
  push:
    branches: [main]
    paths:
      - "api/README.md"
      - "docs/_config.yml"
      - ".github/workflows/pages.yml"

concurrency:
  group: gh-pages-publish

# Least-privilege default; the publish-docs job below grants itself only
# what it actually needs.
permissions: {}

jobs:
  publish-docs:
    name: Publish docs site
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sync docs onto gh-pages
        run: |
          set -euo pipefail

          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages

          # charts/ is release.yml's publish-chart job's own state (the
          # packaged charts themselves are GitHub Release assets, not
          # committed here) - everything else on this branch is the
          # curated docs site, safe to clear and replace below.
          find /tmp/gh-pages -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name charts -exec rm -rf {} +

          cp api/README.md /tmp/gh-pages/README.md
          cp docs/_config.yml /tmp/gh-pages/_config.yml
          # No CNAME: this site has never had a custom domain configured
          # (served at the default zznathans.github.io/aodb/) - unlike
          # aomarket-bot's marketbot.ao.yeetbox.net, copying one here
          # would try to claim a domain with no matching DNS record.

          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no doc changes to publish"
            exit 0
          fi
          git commit -m "docs: publish site [skip ci]"
          git push origin HEAD:gh-pages
