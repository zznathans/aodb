name: Release

# Runs multi-semantic-release once, which independently versions/tags api/
# and chart/ based on which package directory each commit since that
# package's last matching tag actually touched - so a chart-only commit
# never bumps the app's app@X.Y.Z stream and vice versa. Each package's
# own api/.releaserc.json / chart/.releaserc.json controls plugins; MSR
# always tags as ${package.json name}@${version} and silently ignores any
# tagFormat override (a documented MSR limitation, not configurable) -
# hence api/package.json and chart/package.json are named plain "app" and
# "chart" specifically to produce app@X.Y.Z / chart@X.Y.Z tags. Neither
# commits anything back to main (no @semantic-release/git), so branch
# protection on main is never a concern here - only a git tag + GitHub
# Release get created via the API.
#
# Uses the default GITHUB_TOKEN, not a PAT: GITHUB_TOKEN has everything
# needed to create tags/releases given contents:write below. The catch is
# GitHub's anti-recursion rule - events created *using* GITHUB_TOKEN
# (including the release this job creates) never trigger other workflows'
# `release: published` listeners. workflow_dispatch is explicitly exempted
# from that rule, so instead of relying on the release event, the release
# job below diffs tags before/after the run and the dispatch job explicitly
# fires docker.yml / helm-release.yml / pages.yml / update-changelog.yml for
# whichever tag(s) actually got created.
#
# Triggers directly on push to main rather than watching API CI/Chart CI
# finish (as it used to watch one combined "CI" workflow before they were
# split): main's ruleset already requires every check to be green and
# up-to-date before a merge is allowed onto it
# (strict_required_status_checks_policy) - branch protection *is* the gate,
# so a push landing on main has already passed everything that matters.
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  # Split from the dispatch step below (which used to live in this same
  # job) specifically so a failed dispatch can be re-run on its own: if
  # "Re-run failed jobs" only had one job to work with, re-running it would
  # redo the tag diff from scratch, and by then the tags this run just
  # created are no longer "new" - the dispatch would silently never fire.
  # Splitting means a re-run reuses this job's already-computed `tags`
  # output and only re-executes the dispatch.
  release:
    name: Run multi-semantic-release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      tags: ${{ steps.new-tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Record tags before release
        run: git tag --list > /tmp/tags-before.txt

      - name: Run multi-semantic-release
        run: npx --yes multi-semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute newly-created tags
        id: new-tags
        run: |
          git tag --list > /tmp/tags-after.txt
          new_tags=$(comm -13 /tmp/tags-before.txt /tmp/tags-after.txt)
          {
            echo "tags<<EOF"
            echo "$new_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  dispatch:
    name: Dispatch downstream workflows
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      NEW_TAGS: ${{ needs.release.outputs.tags }}
    steps:
      - name: Dispatch downstream workflows for any newly-created tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$NEW_TAGS" ]; then
            echo "No new release - nothing to dispatch."
            exit 0
          fi

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "New tag: $tag"
            case "$tag" in
              app@*)
                gh workflow run docker.yml -f tag="$tag" --repo "$REPO"
                gh workflow run pages.yml -f tag="$tag" --repo "$REPO"
                gh workflow run update-changelog.yml -f tag="$tag" --repo "$REPO"
                ;;
              chart@*)
                gh workflow run helm-release.yml -f tag="$tag" --repo "$REPO"
                gh workflow run update-changelog.yml -f tag="$tag" --repo "$REPO"
                ;;
              *)
                echo "Unrecognized tag format, not dispatching anything: $tag" >&2
                ;;
            esac
          done <<< "$NEW_TAGS"
