name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Run semantic-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      # Mints a short-lived installation token for the aodb-release-bot
      # App instead of using secrets.GITHUB_TOKEN. Two reasons this needs
      # to not be the default token: (1) @semantic-release/git (see
      # .releaserc.json) pushes a commit straight to main, which main's
      # own ruleset would otherwise block from a non-bypass actor; (2) a
      # release/tag created with the default token never fires other
      # workflows' release:published listeners (GitHub's anti-recursion
      # rule) -- relevant for any future release:published-triggered
      # workflow. See
      # https://github.com/semantic-release/semantic-release/discussions/1906.
      - name: Generate a token for the release App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Also required for the App token to actually be used for git
          # operations rather than the default token checkout would
          # otherwise wire in -- same "persist-credentials: false" fix
          # documented in the discussion linked above.
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # @semantic-release-plus/docker (see .releaserc.json) doesn't build
      # the image itself -- it expects an already-built, locally-tagged
      # image (hence --load) and re-tags/pushes it once the release
      # version is known. cache-from reuses whatever layers docker.yml's
      # PR-time build-verification job already left in the GHA cache for
      # this same commit, so this is usually a re-assembly of
      # already-built layers rather than a from-scratch build. Single-arch
      # (amd64, the runner's own platform) -- no multi-arch manifest, no
      # docker-slim variant; the docker plugin re-tags/pushes a single
      # already-built image, it doesn't support either.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./api
          push: false
          load: true
          tags: aodb:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # skipLogin: true in .releaserc.json's docker plugin config, so
      # login happens here instead.
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
            @semantic-release-plus/docker
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
