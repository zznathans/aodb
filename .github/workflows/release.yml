name: Release

# Runs multi-semantic-release once, which independently versions/tags api/
# and chart/ based on which package directory each commit since that
# package's last matching tag actually touched - so a chart-only commit
# never bumps the app's app@X.Y.Z stream and vice versa. Each package's
# own api/.releaserc.json / chart/.releaserc.json controls plugins; MSR
# always tags as ${package.json name}@${version} and silently ignores any
# tagFormat override (a documented MSR limitation, not configurable) -
# hence api/package.json and chart/package.json are named plain "app" and
# "chart" specifically to produce app@X.Y.Z / chart@X.Y.Z tags. Neither
# commits anything back to main (no @semantic-release/git), so branch
# protection on main is never a concern here - only a git tag + GitHub
# Release get created via the API.
#
# Authenticates as the aodb-release-bot GitHub App (same one docker.yml's
# bump-chart-image-tag / helm-release.yml's sync-chart-yaml /
# update-changelog.yml / reg_clean.yaml already use) rather than the
# default GITHUB_TOKEN. This used to run as GITHUB_TOKEN specifically to
# get contents:write for free, but that hit GitHub's anti-recursion rule:
# events created *using* GITHUB_TOKEN never trigger other workflows'
# `release: published` listeners - so this job used to diff tags
# before/after its own run and explicitly `gh workflow run` each
# downstream workflow (docker.yml/helm-release.yml/pages.yml/
# update-changelog.yml) for whichever tag(s) it had just created. That
# custom dispatch was also fragile: a failure partway through (mid an
# outage, more than once) silently dropped a tag with nothing to retry it
# short of a manual re-dispatch. App-installation tokens aren't subject to
# the anti-recursion rule, so releases created here now trigger those four
# workflows' *existing* `release: published` triggers directly and
# reliably - for every tag/release on the repo, not just ones this job's
# own dispatch logic knew to fan out to (a manually-created release now
# triggers them too, for free). No custom dispatch step needed at all.
#
# Triggers directly on push to main rather than watching API CI/Chart CI
# finish (as it used to watch one combined "CI" workflow before they were
# split): main's ruleset already requires every check to be green and
# up-to-date before a merge is allowed onto it
# (strict_required_status_checks_policy) - branch protection *is* the gate,
# so a push landing on main has already passed everything that matters.
on:
  push:
    branches: [main]

jobs:
  release:
    name: Run multi-semantic-release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions: {}
    steps:
      - name: Generate a token for the release bot
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run multi-semantic-release
        run: npx --yes multi-semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
