name: Release

# Runs semantic-release once for the whole repo - api/ and chart/ share one
# version number, so a fix/feat anywhere cuts one tag/release covering
# both. This used to be multi-semantic-release independently versioning
# api/ and chart/ as separate app@X.Y.Z/chart@X.Y.Z streams; that
# independence was the root cause of a whole class of bugs (chart
# Chart.yaml/values.yaml.imageTag drifting out of sync, bot-opened sync
# PRs cascading into extra chart-only releases, orphaned-dispatch
# recoveries) - unifying the version removes the need to reconcile
# anything after the fact, because it's never allowed to diverge in the
# first place.
#
# Uses the default GITHUB_TOKEN - no GitHub App needed here (or anywhere
# else in this file). Every downstream step used to run as a separate
# release:published-triggered workflow specifically to work around
# GITHUB_TOKEN's anti-recursion rule (events created *using* GITHUB_TOKEN
# never trigger other workflows), which meant the tag/release itself had
# to be created by a non-GITHUB_TOKEN identity (the aodb-release-bot App)
# for those downstream workflows to fire at all. Chaining everything as
# needs:-linked jobs in this single run sidesteps that rule entirely -
# nothing here depends on an event firing, so plain GITHUB_TOKEN is enough
# throughout (matches aomarket-bot's release.yml, which never needed an
# App for exactly this reason). reg_clean.yaml still needs the App - that's
# for Packages:write, a separate concern GITHUB_TOKEN can't get regardless
# of declared permissions.
#
# Triggers directly on push to main rather than watching a CI workflow
# finish: main's ruleset already requires every check to be green and
# up-to-date before a merge is allowed onto it
# (strict_required_status_checks_policy) - branch protection *is* the
# gate, so a push landing on main has already passed everything that
# matters.
on:
  push:
    branches: [main]

jobs:
  release:
    name: Run semantic-release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main

      - uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v4
        id: semantic
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # linux/amd64 and linux/arm64 build on their own native runner each
  # (GitHub's free hosted arm64 runners for public repos) rather than one
  # job cross-building both via QEMU - emulation was the dominant cost of
  # a cold-cache build (~2.5min). Each leg pushes by digest only; the
  # merge-and-scan job below combines both digests into one multi-arch
  # manifest under the real tags.
  build:
    name: Build (${{ matrix.platform }})
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.git_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./api
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/zznathans/aodb,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Sanitize platform name for the artifact name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-and-scan:
    name: Merge manifest, scan, and push a slim variant
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.git_tag }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Compute tags from the release version
        id: version
        run: echo "major_minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/zznathans/aodb
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=${{ steps.version.outputs.major_minor }}

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" \
            $(printf 'ghcr.io/zznathans/aodb@sha256:%s ' *)

      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect ghcr.io/zznathans/aodb:${{ env.VERSION }}

      # Two separate scans rather than one gating on `format: sarif`: the
      # sarif+exit-code combination in this trivy-action version was
      # observed to fail the step (nonzero `outcome`) even when the
      # produced SARIF had zero results (verified via the GitHub
      # code-scanning API - genuinely empty) and a local `trivy image` run
      # against the exact same pushed digest, same pinned trivy version,
      # passed clean. Trusting a `continue-on-error` step's ambiguous
      # `outcome` for the actual gate isn't reliable; a plain `format:
      # table` scan's own exit code is unambiguous, so let it fail the job
      # directly.
      #
      # Scans the tag (not a specific platform digest) - Trivy resolves a
      # multi-arch ref to the image matching the runner it's on (amd64
      # here), which is what most users will actually pull.
      - name: Scan image for vulnerabilities (fails the build on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/zznathans/aodb:${{ env.VERSION }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate SARIF for the Security tab (informational, non-gating)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/zznathans/aodb:${{ env.VERSION }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

      # docker-slim needs a concrete local image to dynamically analyze,
      # not a remote multi-arch manifest ref - pull the tag we just
      # pushed, which resolves to this runner's own platform (amd64).
      # Matches aomarket-bot's release.yml pattern; see that chart's
      # README for the caveat this carries (strips anything not observed
      # during the dynamic-analysis pass, so a rarely-exercised code path
      # can be less stable than the regular image).
      - name: Pull the amd64 image for slimming
        run: docker pull ghcr.io/zznathans/aodb:${{ env.VERSION }}

      - uses: kitabisa/docker-slim-action@6a9a64eaf0c08b1251c148514dd70be1495bff12 # v1.2.0
        env:
          DSLIM_HTTP_PROBE: false
        with:
          target: ghcr.io/zznathans/aodb:${{ env.VERSION }}
          tag: slim

      - name: Tag and push the slim variant
        run: |
          docker tag ghcr.io/zznathans/aodb:slim "ghcr.io/zznathans/aodb:${VERSION}-slim"
          docker tag ghcr.io/zznathans/aodb:slim "ghcr.io/zznathans/aodb:${{ steps.version.outputs.major_minor }}-slim"
          docker push "ghcr.io/zznathans/aodb:${VERSION}-slim"
          docker push "ghcr.io/zznathans/aodb:${{ steps.version.outputs.major_minor }}-slim"

      - name: Scan the slim image for vulnerabilities (fails the build on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/zznathans/aodb:${{ env.VERSION }}-slim
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate SARIF for the slim image (informational, non-gating)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/zznathans/aodb:${{ env.VERSION }}-slim
          format: sarif
          output: trivy-results-slim.sarif
          exit-code: "0"

      - name: Upload Trivy scan results (slim image)
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always() && hashFiles('trivy-results-slim.sarif') != ''
        with:
          sarif_file: trivy-results-slim.sarif
          category: trivy-image-scan-slim

  # Packages chart/ and attaches the .tgz to the GitHub Release
  # `release` just created, then publishes it two ways: as an OCI artifact
  # at ghcr.io/zznathans/aodb/charts (no `helm repo add` needed, the
  # primary/recommended path) and, for backwards compatibility with
  # third-party tooling that doesn't speak OCI registries yet, to a
  # classic Helm chart index at gh-pages:charts/ (served at
  # https://zznathans.github.io/aodb/charts/) so `helm repo add` still
  # works too.
  #
  # chart/Chart.yaml's version/appVersion *and* chart/values.yaml's
  # imageTag are both bumped to this release's version in this job's own
  # local checkout only, never committed back to main - main gets no sync
  # PR at all now, because there's nothing left to reconcile: the app
  # image and the chart always share the same version number, so
  # values.yaml.imageTag can just always equal the release version
  # directly (previously a separate bot-opened "bump chart image tag" PR
  # per app release, plus a separate "sync Chart.yaml" PR per chart
  # release - both existed purely to chase two independently-versioned
  # streams back into agreement).
  publish-chart:
    name: Package chart and publish
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    # Shared with pages.yml's publish-docs job - both push to gh-pages,
    # this serializes them instead of letting them race.
    concurrency:
      group: gh-pages-publish
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.git_tag }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # Also checked out alongside the tag checkout above (into gh-pages/)
      # rather than in a separate job handed the packaged chart via
      # upload-artifact/download-artifact - that round trip turned out
      # unreliable (the artifact was gone by the time a later step looked
      # for it). Packaging and publishing the index share one job/checkout
      # instead, no cross-job file handoff needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: gh-pages

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "3.17.0"

      - name: Sync Chart.yaml and values.yaml.imageTag to the release version
        run: |
          sh scripts/bump-chart-version.sh "$VERSION"
          sed -i \
            -e "s|^  imageRepository:.*|  imageRepository: ghcr.io/zznathans/aodb|" \
            -e "s|^  imageTag:.*|  imageTag: \"${VERSION}\"|" \
            chart/values.yaml

      - name: Package chart
        run: helm package chart -d .cr-release-packages

      - name: Upload package to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" .cr-release-packages/*.tgz --clobber --repo "${{ github.repository }}"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR (OCI)
        run: helm push .cr-release-packages/*.tgz oci://ghcr.io/zznathans/aodb/charts

      - name: Add the new package and regenerate charts/index.yaml
        run: |
          mkdir -p gh-pages/charts
          cp .cr-release-packages/*.tgz gh-pages/charts/
          helm repo index gh-pages/charts --url https://zznathans.github.io/aodb/charts --merge gh-pages/charts/index.yaml

      - name: Commit and push the index
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts
          if git diff --cached --quiet; then
            echo "Index already up to date, nothing to do."
            exit 0
          fi
          git commit -m "chore(charts): publish ${RELEASE_TAG} to the index"
          git push origin gh-pages

  # One root CHANGELOG.md now (was separate api/CHANGELOG.md and
  # chart/CHANGELOG.md, one per independently-versioned package - no
  # longer needed with a single shared version stream). Still a
  # bot-opened PR (main requires a PR either way), just plain
  # GITHUB_TOKEN now - no App needed, since nothing depends on this PR's
  # own creation/merge *event* triggering anything else.
  update-changelog:
    name: Update CHANGELOG
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.git_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepend release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_date=$(gh release view "$RELEASE_TAG" --json publishedAt --jq .publishedAt)
          release_body=$(gh release view "$RELEASE_TAG" --json body --jq .body)
          {
            echo "## ${RELEASE_TAG} (${release_date%%T*})"
            echo
            echo "$release_body"
            echo
            if [ -f CHANGELOG.md ]; then
              cat CHANGELOG.md
            fi
          } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `git diff` never shows untracked files, so on a brand-new
          # CHANGELOG.md this always read as "no diff" and silently
          # skipped every run, forever - stage first and diff the index
          # instead, which correctly reports new files too.
          git add CHANGELOG.md
          if git diff --cached --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already up to date, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="changelog-${RELEASE_TAG}"
          git checkout -b "$branch"
          git commit -m "docs(changelog): add ${RELEASE_TAG} release notes"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "docs(changelog): add ${RELEASE_TAG} release notes" \
            --body "Adds the ${RELEASE_TAG} release notes to CHANGELOG.md.")
          gh pr merge --auto --merge "$pr_url"

          # gh pr merge --auto doesn't reliably self-update a branch that
          # falls BEHIND main (e.g. another bot PR opened around the same
          # time merges first) - poll and nudge it explicitly rather than
          # leaving it stuck waiting indefinitely.
          pr_number=$(gh pr view "$pr_url" --json number --jq .number)
          for i in $(seq 1 12); do
            state=$(gh pr view "$pr_number" --json state,mergeStateStatus --jq '"\(.state) \(.mergeStateStatus)"')
            case "$state" in
              MERGED*) exit 0 ;;
              *BEHIND) gh api -X PUT "repos/${{ github.repository }}/pulls/${pr_number}/update-branch" || true ;;
            esac
            sleep 10
          done
