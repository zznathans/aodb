name: Docker

# Builds and pushes the actual release image, triggered once
# @semantic-release/github's publish step (see .releaserc.json) creates the
# GitHub Release for a version-bump commit that already landed on main.
# release.yml used to do this inline via @semantic-release-plus/docker
# (re-tagging/pushing an already-built local image), but that plugin's
# local-image-build step was removed from release.yml without removing the
# plugin itself, which then failed every release outright ("No such image:
# aodb:release") before @semantic-release/github's publish step ever ran -
# so no GitHub Release, and this workflow, ever fired. Building and pushing
# here directly sidesteps that path entirely.
on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build-and-push-image:
    runs-on: ubuntu-latest


    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@0a596b2e7a325f0cedf8e9bd21ab002cbd3c9241
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # Explicit tags, not metadata-action's default ref-based preset: that
      # preset tags the image from the raw git ref (v1.7.5, matching the
      # release tag) - but chart/values.yaml's imageTag is set from
      # semantic-release's nextRelease.version instead (1.7.5, no "v" -
      # see .releaserc.json/scripts/bump-chart-version.sh), so the chart's
      # default was pointing at a tag that never got pushed. type=semver
      # strips the "v" to match; type=raw adds the floating `latest` tag
      # the README's Releases section already documents.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@703896b4f30f62d53f5530a80bcdc589a3f702bc
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest


      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820
        with:
          context: api/.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true