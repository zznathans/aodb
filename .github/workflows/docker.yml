name: Docker

on:
  pull_request:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only granted for same-repo PRs (see the `if` below) - a fork PR runs
      # with read-only GITHUB_TOKEN regardless, so packages: write here can't
      # be exploited by a forked pull_request to push images.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Fork PRs get a read-only token, so login/push would fail - skip it
      # and keep the plain build as the check for those.
      - name: Log in to the Container registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache instead of type=gha: gha-backend cache entries are immutable, so
          # buildx re-uploads the *entire* cache blob set on every single build regardless of
          # whether anything changed (a fixed ~30s tax we measured on an otherwise fully
          # cache-hit build), and gha cache is scoped per-branch/base-branch - since this
          # workflow only runs on pull_request (never a push to main), no branch ever seeds a
          # shared base cache, so every new PR branch starts cold. A registry stores cache
          # layers as content-addressed blobs, so unchanged layers are skipped on push (real
          # incremental caching) and every branch shares the one `buildcache` tag.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}
