name: Docker

# Triggered via workflow_dispatch from release.yml (not `release: published`
# - GITHUB_TOKEN-created releases don't fire that event, see release.yml's
# comment) with the just-created tag as an input. `release: published` is
# also kept as a trigger so a manually-published/edited release (via the
# web UI, not GITHUB_TOKEN) still works the normal way.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The app@X.Y.Z release tag to build/push"
        required: true

# Least-privilege default; each job below grants itself only what it actually needs.
permissions: {}

jobs:
  # linux/amd64 and linux/arm64 build on their own native runner each
  # (GitHub added free hosted arm64 runners for public repos) rather than
  # one job cross-building both via QEMU - emulation was the dominant cost
  # of a cold-cache build (~2.5min). Each leg pushes by digest only; the
  # merge job below combines both digests into one multi-arch manifest
  # under the real tags. Standard docker/build-push-action recipe for
  # splitting multi-platform builds across runners.
  build:
    name: Build (${{ matrix.platform }})
    if: startsWith(github.event.inputs.tag || github.event.release.tag_name, 'app@')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./api
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/zznathans/aodb,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Sanitize platform name for the artifact name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-and-scan:
    name: Merge manifest and scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Compute image tags from the release tag
        id: version
        run: |
          version="${RELEASE_TAG#app@}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/zznathans/aodb
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" \
            $(printf 'ghcr.io/zznathans/aodb@sha256:%s ' *)

      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect ghcr.io/zznathans/aodb:${{ steps.version.outputs.version }}

      # Two separate scans rather than one gating on `format: sarif`: the sarif+exit-code
      # combination in this trivy-action version was observed to fail the step (nonzero
      # `outcome`) even when the produced SARIF had zero results (verified via the GitHub
      # code-scanning API - genuinely empty) and a local `trivy image` run against the exact
      # same pushed digest, same pinned trivy version, passed clean. Trusting a `continue-on-
      # error` step's ambiguous `outcome` for the actual gate isn't reliable; a plain
      # `format: table` scan's own exit code is unambiguous, so let it fail the job directly.
      #
      # Scans the tag (not a specific platform digest) - Trivy resolves a
      # multi-arch ref to the image matching the runner it's on (amd64
      # here), which is what most users will actually pull.
      - name: Scan image for vulnerabilities (fails the build on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/zznathans/aodb:${{ steps.version.outputs.version }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate SARIF for the Security tab (informational, non-gating)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/zznathans/aodb:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      # Pinned to a fixed string rather than left to auto-derive from the
      # job name: without this, codeql-action defaults the category to
      # "<workflow file>:<job id>", and a later job rename (this one used
      # to be "build-and-push") silently starts a *new* alert stream -
      # the old category's alerts never get superseded by fresh scans and
      # sit "open" in the Security tab forever, however stale. Confirmed
      # live: 61 of 76 "open" Trivy alerts were exactly this - a
      # pre-distroless-migration image's findings, still shown open next
      # to the real (15-finding) current scan under a different category.
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

  bump-chart-image-tag:
    name: Bump chart image tag
    needs: merge-and-scan
    runs-on: ubuntu-latest
    permissions: {}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      # Minted from the aodb-release-bot GitHub App (APP_ID/APP_PRIVATE_KEY)
      # rather than GITHUB_TOKEN: App installation tokens aren't subject to
      # GitHub's anti-recursion rule, so the PR this job opens gets a normal
      # CI run - a GITHUB_TOKEN-opened PR wouldn't, and would sit blocked on
      # required status checks until someone manually nudged it.
      - name: Generate a token for the release bot
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump chart/values.yaml image tag and open a PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version="${RELEASE_TAG#app@}"

          sed -i \
            -e "s|^  imageRepository:.*|  imageRepository: ghcr.io/zznathans/aodb|" \
            -e "s|^  imageTag:.*|  imageTag: \"${version}\"|" \
            chart/values.yaml

          if git diff --quiet -- chart/values.yaml; then
            echo "Image repository/tag already up to date, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="bump-chart-image-${RELEASE_TAG}"
          git checkout -b "$branch"
          git add chart/values.yaml
          git commit -m "fix(chart): bump image to ${RELEASE_TAG}"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "fix(chart): bump image to ${RELEASE_TAG}" \
            --body "Bumps the chart's default image tag to [${RELEASE_TAG}](https://github.com/zznathans/aodb/releases/tag/${RELEASE_TAG}).")
          gh pr merge --auto --merge "$pr_url"

          # gh pr merge --auto doesn't reliably self-update a branch that
          # falls BEHIND main (e.g. another bot PR opened around the same
          # time - update-changelog.yml's, off the same release event -
          # merges first) - poll and nudge it explicitly rather than
          # leaving it stuck waiting indefinitely.
          pr_number=$(gh pr view "$pr_url" --json number --jq .number)
          for i in $(seq 1 12); do
            state=$(gh pr view "$pr_number" --json state,mergeStateStatus --jq '"\(.state) \(.mergeStateStatus)"')
            case "$state" in
              MERGED*) exit 0 ;;
              *BEHIND) gh api -X PUT "repos/${{ github.repository }}/pulls/${pr_number}/update-branch" || true ;;
            esac
            sleep 10
          done
