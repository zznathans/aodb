name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default; each job below grants itself only what it actually needs.
permissions: {}

jobs:
  lint:
    name: Lint (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
        working-directory: api
      - run: ruff check app tests
        working-directory: api

  test:
    name: Tests (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
        working-directory: api
      - run: pytest
        working-directory: api

  yamllint:
    name: Yamllint (chart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-ci.txt
      - run: yamllint -c .yamllint.yaml chart

  helm-lint:
    name: Helm Lint (chart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "3.17.0"
      - name: Run helm lint
        run: |
          helm lint chart --strict \
            --set aodbApi.dumpUrl=https://example.invalid/dump.xml.zip \
            --set aodbApi.redisUrl=redis://example-redis:6379/0

  helm-unittest:
    name: Helm Unit Tests (chart)
    needs: [helm-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "3.17.0"
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.6.2
      - name: Run helm unit tests
        run: helm unittest chart
