name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default; each job below grants itself only what it actually needs.
permissions: {}

jobs:
  # Every job below still always *runs* (reports a status) so the
  # required-status-checks ruleset on main never sees a check that
  # silently never reports - it just does nothing (fast) when the paths
  # it cares about didn't change. This is deliberately job-level `if:`
  # gating, not a workflow-level `on.paths` filter: GitHub treats a
  # skipped job as satisfying a required check, but a workflow that never
  # triggers at all leaves that required check pending forever.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            chart:
              - 'chart/**'
              - '.yamllint.yaml'

  lint:
    name: Lint (api)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
        working-directory: api
      - run: ruff check app tests
        working-directory: api

  test:
    name: Tests (api)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # pull-requests: write is for the Coveralls step below (it posts a PR
    # comment with the coverage diff) - everything else in this job needs
    # no elevated permissions.
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
        working-directory: api
      - run: pytest --cov=app --cov-report=lcov:coverage.lcov
        working-directory: api

      # Informational only (see the repo README for why) - not a required
      # status check, so a coverage regression never blocks merging.
      # Doesn't need a repo token: defaults to github-token: github.token
      # and auto-creates the repo on Coveralls on first post.
      # continue-on-error because the action's own default (fail-on-error:
      # true) means a Coveralls-side outage - not our data - would
      # otherwise fail this job and cascade into skipping every job after
      # it, including blocking the Release workflow entirely.
      - name: Coveralls
        continue-on-error: true
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: api/coverage.lcov
          base-path: api

  yamllint:
    name: Yamllint (chart)
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-ci.txt
      - run: yamllint -c .yamllint.yaml chart

  helm-lint:
    name: Helm Lint (chart)
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "3.17.0"
      - name: Run helm lint
        run: |
          helm lint chart --strict \
            --set aodbApi.dumpUrl=https://example.invalid/dump.xml.zip \
            --set aodbApi.redisUrl=redis://example-redis:6379/0

  helm-unittest:
    name: Helm Unit Tests (chart)
    needs: [changes, helm-lint]
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "3.17.0"
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.6.2
      - name: Run helm unit tests
        run: helm unittest chart
