name: Chart Publish

# Triggered by the version-bump commit release.yml's @semantic-release/git
# step pushes to main -- Chart.yaml/values.yaml already carry the release
# version by the time that commit lands, so this just packages and
# publishes whatever's currently on disk rather than needing to know the
# release tag separately. A plain push works here (no App-token trigger
# workaround needed, unlike a release:published-triggered workflow would)
# since that commit no longer carries [skip ci].
on:
  push:
    branches: [main]
    paths:
      - "chart/**"

permissions:
  contents: read
  packages: write

jobs:
  publish-oci:
    name: Publish (OCI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "3.17.0"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          set -euo pipefail
          helm package chart -d /tmp/chart-out
          helm push /tmp/chart-out/aodb-*.tgz oci://ghcr.io/zznathans/aodb/charts

  # Legacy publish path for tooling that doesn't speak OCI registries yet
  # -- packages the chart and updates gh-pages' index.yaml (a classic Helm
  # chart repo, `helm repo add`-able). Independent of publish-oci above;
  # either one failing doesn't block the other. gh-pages has no branch
  # protection (only main does), so the default GITHUB_TOKEN's contents:
  # write permission is all this needs -- no App token required, unlike
  # release.yml's push to main.
  publish-gh-pages:
    name: Publish (gh-pages)
    runs-on: ubuntu-latest
    # Shared with pages.yml's publish-docs job so the two never push to
    # gh-pages at the same time.
    concurrency:
      group: gh-pages-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: .
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
