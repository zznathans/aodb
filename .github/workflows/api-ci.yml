name: API CI

# Push to any branch except main (so work-in-progress branches get
# feedback before a PR even exists), and pull_request. Deliberately no
# push[main]: main's ruleset already requires this to be up-to-date and
# green before allowing merge (strict_required_status_checks_policy), so
# re-running it again on the post-merge push to main would just re-verify
# code that already passed.
on:
  push:
    branches-ignore: [main]
  pull_request:

# Least-privilege default; each job below grants itself only what it actually needs.
permissions: {}

jobs:
  # Once a branch has an open PR, pull_request already covers every push
  # to it -- without this, the plain push trigger above would fire a
  # second, redundant run for the exact same commit. Only runs for the
  # push event (a pull_request run always proceeds straight to the jobs
  # below); asks the GitHub API whether the pushed branch has an open PR
  # and, if so, lets those jobs report nothing further.
  check-pr:
    name: Check for open PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      has_open_pr: ${{ steps.check.outputs.has_open_pr }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json number --jq 'length')
          echo "has_open_pr=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Still runs unconditionally (not a workflow-level `on.paths` filter) so
  # this required check never sits pending forever on a PR that doesn't
  # touch api/ - it just does nothing (fast) via the job-level `if:` below.
  changes:
    name: Detect changed paths
    needs: check-pr
    if: always() && (github.event_name == 'pull_request' || needs.check-pr.outputs.has_open_pr == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            api:
              - 'api/**'

  # Matches aomarket-bot's ci.yml lockfile-check job, adapted: aodb's
  # requirements*.txt are compiled from requirements*.in via pip-tools'
  # pip-compile (not uv pip compile from pyproject.toml, which is what
  # aomarket-bot does - it has no requirements*.in files, its deps are
  # declared directly in pyproject.toml). The committed files' own header
  # comment records the exact `pip-compile --generate-hashes
  # --output-file=... ...` invocation used, so regenerating with anything
  # else (uv's compiler included) would show a spurious diff on that
  # comment line alone even if the resolved dependency set matches.
  lockfile-check:
    name: requirements*.txt match requirements*.in
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install pip-tools
      - name: Regenerate and diff against committed lockfiles
        working-directory: api
        run: |
          set -euo pipefail
          cp requirements.txt /tmp/requirements.txt.committed
          cp requirements-dev.txt /tmp/requirements-dev.txt.committed
          pip-compile --generate-hashes --output-file=requirements.txt requirements.in
          pip-compile --generate-hashes --output-file=requirements-dev.txt requirements-dev.in
          diff -u /tmp/requirements.txt.committed requirements.txt
          diff -u /tmp/requirements-dev.txt.committed requirements-dev.txt

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
        working-directory: api
      - run: ruff check app tests
        working-directory: api

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # pull-requests: write is for the Coveralls step below (it posts a PR
    # comment with the coverage diff) - everything else in this job needs
    # no elevated permissions.
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
        working-directory: api
      - run: pytest --cov=app --cov-report=lcov:coverage.lcov
        working-directory: api

      # Informational only (see the repo README for why) - not a required
      # status check, so a coverage regression never blocks merging.
      # Doesn't need a repo token: defaults to github-token: github.token
      # and auto-creates the repo on Coveralls on first post.
      # continue-on-error because the action's own default (fail-on-error:
      # true) means a Coveralls-side outage - not our data - would
      # otherwise fail this job and cascade into skipping every job after
      # it, including blocking the Release workflow entirely.
      - name: Coveralls
        continue-on-error: true
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: api/coverage.lcov
          base-path: api
