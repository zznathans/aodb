version: 2
updates:
  # api/requirements.txt / api/requirements-dev.txt - the app's own deps.
  - package-ecosystem: pip
    directory: "/api"
    schedule:
      interval: daily

  # requirements-ci.txt at repo root - CI-only tooling (yamllint) that
  # isn't an api/ dependency.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: "/api"
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
