version: 2
updates:
  - package-ecosystem: pip
    directory: "/api"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: "/api"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
